<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src *; child-src *;"
    />
    <title>FramelessViewer</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <!-- 顶部拖拽条：只有 10px，看不见但能拖动窗口 -->
    <div id="drag-strip"></div>

    <!-- 网页内容 -->
    <webview id="view" src="about:blank" allowpopups></webview>

    <!-- 右上角控制入口：平时隐藏，鼠标碰到顶部才浮现 -->
    <div id="pill-zone">
      <button id="pill" type="button" title="控制面板 (Ctrl+Alt+P)" aria-label="控制面板">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            d="M4 7h16M4 12h16M4 17h10"
          />
        </svg>
      </button>
    </div>

    <!-- 当前窗口模式：非普通模式时常驻，提醒点击是否可用（穿透时点击会落空） -->
    <div id="mode-badge" class="hidden" aria-live="polite"></div>

    <!-- 控制面板 -->
    <section id="panel" class="hidden" aria-label="控制面板">
      <header class="panel-head">
        <span class="brand">FramelessViewer</span>
        <button id="panel-close" class="icon-btn" type="button" title="关闭 (Esc)">✕</button>
      </header>

      <div class="row">
        <label class="row-label" for="opacity">不透明度</label>
        <output id="opacity-value" class="value">100%</output>
      </div>
      <input id="opacity" class="slider" type="range" min="10" max="100" step="1" value="100" />

      <div class="row">
        <span class="row-label">宽高比</span>
        <div class="stepper">
          <button class="icon-btn" type="button" data-run="aspect-prev" title="上一个">‹</button>
          <span id="aspect-label" class="value wide">自由</span>
          <button class="icon-btn" type="button" data-run="aspect-next" title="下一个">›</button>
        </div>
      </div>

      <div class="row">
        <span class="row-label">窗口模式</span>
        <span class="value">置顶 · 穿透 · 悬浮</span>
      </div>
      <div class="chips">
        <button class="chip" type="button" data-mode="normal" title="不置顶、不穿透">普通</button>
        <button class="chip" type="button" data-mode="floating" title="置顶 + 预设不透明度 (Ctrl+Alt+F)">悬浮</button>
        <button class="chip" type="button" data-mode="through" title="置顶 + 鼠标穿透 (Ctrl+Alt+F)">穿透</button>
      </div>

      <div class="chips wrap">
        <button class="chip" type="button" data-toggle="scrollbars" title="Ctrl+Alt+S">隐藏滚动条</button>
        <button class="chip" type="button" data-toggle="startanimation" title="开屏时播放动画">开屏动画</button>
      </div>

      <div class="row">
        <span class="row-label">窗口尺寸</span>
        <span id="size-label" class="value">—</span>
      </div>
      <div class="chips">
        <button class="chip ghost" type="button" data-run="size-down">－ 缩小</button>
        <button class="chip ghost" type="button" data-run="size-up">＋ 放大</button>
      </div>
      <div class="chips wrap" id="size-presets"></div>

      <div class="chips">
        <button class="chip ghost" type="button" data-run="toggle-urlbar" title="Ctrl+L">输入网址</button>
        <button class="chip ghost" type="button" data-run="reload">重新加载</button>
        <button class="chip ghost" type="button" data-run="reset">重置</button>
        <button class="chip danger" type="button" data-run="quit">退出</button>
      </div>

      <footer class="panel-foot">
        <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>F</kbd> 模式 ·
        <kbd>Ctrl</kbd>+<kbd>L</kbd> 网址 ·
        <kbd>Esc</kbd> 隐藏 ·
        <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>Q</kbd> 关闭
      </footer>
    </section>

    <!-- 网址输入条：无地址栏，按 Ctrl+L 才出现 -->
    <div id="urlbar" class="hidden">
      <svg class="urlbar-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M4 12h16M12 4c3 3.5 3 12.5 0 16M12 4c-3 3.5-3 12.5 0 16" fill="none" stroke="currentColor" stroke-width="1.6" />
      </svg>
      <input
        id="url-input"
        type="text"
        placeholder="输入网址后回车 · Esc 取消"
        spellcheck="false"
        autocomplete="off"
      />
    </div>

    <!-- 顶部提示 -->
    <div id="hud" class="hidden"></div>

    <!-- 加载中提示 -->
    <div id="loading" class="hidden"><span class="spinner"></span></div>

    <script src="shell.js"></script>
  </body>
</html>
