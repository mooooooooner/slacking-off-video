<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;"
    />
    <title>FramelessViewer</title>
    <style>
      :root {
        --accent: #ff9350;
        --accent-2: #e8547e;
        --text: #e8e9f0;
        --dim: #8f96ab;
        --bg: #0f1015;
        --font: system-ui, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      /* 背景：两团缓慢漂移的柔光，负责「呼吸感」 */
      .aurora {
        position: fixed;
        inset: -25%;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(42% 38% at 28% 26%, rgba(255, 147, 80, 0.16), transparent 70%),
          radial-gradient(50% 44% at 74% 72%, rgba(232, 84, 126, 0.15), transparent 72%);
        filter: blur(42px);
        animation: drift 24s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          transform: translate3d(-2.5%, -1.5%, 0) scale(1);
        }
        to {
          transform: translate3d(2.5%, 2%, 0) scale(1.1);
        }
      }

      /* 暗角，让中心更聚焦 */
      .vignette {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(120% 100% at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
      }

      .stage {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
      }

      /* 图标：外框 + 内页，一笔一笔画出来 */
      .mark {
        width: 88px;
        height: 88px;
        opacity: 0;
        filter: drop-shadow(0 0 22px rgba(232, 84, 126, 0.35));
        animation: mark-in 1s ease-out 0.05s forwards;
      }

      .mark .ring,
      .mark .page {
        fill: none;
        stroke: url(#mark-gradient);
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .mark .ring {
        stroke-width: 3;
        stroke-dasharray: 270;
        stroke-dashoffset: 270;
        animation: draw 1.4s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }

      .mark .page {
        stroke-width: 2.6;
        stroke-dasharray: 134;
        stroke-dashoffset: 134;
        animation: draw 1s cubic-bezier(0.65, 0, 0.35, 1) 0.7s forwards;
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes mark-in {
        to {
          opacity: 1;
        }
      }

      h1 {
        margin: 26px 0 0;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 0.02em;
        background: linear-gradient(92deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
        animation: title-in 1s cubic-bezier(0.22, 0.7, 0.24, 1) 0.85s forwards;
      }

      @keyframes title-in {
        from {
          opacity: 0;
          transform: translateY(12px);
          letter-spacing: 0.2em;
        }
        to {
          opacity: 1;
          transform: none;
          letter-spacing: 0.02em;
        }
      }

      .tagline {
        margin: 12px 0 0;
        color: var(--dim);
        font-size: 13px;
        letter-spacing: 0.34em;
        opacity: 0;
        animation: fade-in 1s ease 1.25s forwards;
      }

      /* 一条渐变细线，从中心向两侧铺开 */
      .rule {
        width: 0;
        height: 1px;
        margin: 30px 0 26px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
        opacity: 0.7;
        animation: rule-in 1.1s cubic-bezier(0.4, 0, 0.2, 1) 1.5s forwards;
      }

      @keyframes rule-in {
        from {
          width: 0;
          opacity: 0;
        }
        to {
          width: min(320px, 62vw);
          opacity: 0.7;
        }
      }

      .hint {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--dim);
        font-size: 12.5px;
        letter-spacing: 0.02em;
        opacity: 0;
        animation: fade-in 1s ease 1.8s forwards;
      }

      @keyframes fade-in {
        to {
          opacity: 1;
        }
      }

      kbd {
        font-family: inherit;
        font-size: 11px;
        color: var(--text);
        padding: 3px 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-bottom-color: rgba(0, 0, 0, 0.5);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
        animation: breathe 3.4s ease-in-out 2.6s infinite;
      }

      /* 提示键轻微呼吸，不喧宾夺主 */
      @keyframes breathe {
        0%,
        100% {
          border-color: rgba(255, 255, 255, 0.14);
          background: rgba(255, 255, 255, 0.06);
        }
        50% {
          border-color: rgba(255, 147, 80, 0.55);
          background: rgba(255, 147, 80, 0.1);
        }
      }

      .hint .sep {
        color: rgba(255, 255, 255, 0.28);
      }

      @media (prefers-reduced-motion: reduce) {
        .aurora,
        .mark,
        .mark .ring,
        .mark .page,
        h1,
        .tagline,
        .rule,
        .hint,
        kbd {
          animation: none !important;
        }
        .mark,
        h1,
        .tagline,
        .hint {
          opacity: 1;
        }
        .rule {
          width: min(320px, 62vw);
        }
        .mark .ring,
        .mark .page {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="aurora"></div>
    <div class="vignette"></div>

    <main class="stage">
      <svg class="mark" viewBox="0 0 88 88" width="88" height="88" aria-hidden="true">
        <defs>
          <linearGradient id="mark-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffa03c" />
            <stop offset="1" stop-color="#e8547e" />
          </linearGradient>
        </defs>
        <rect class="ring" x="6" y="6" width="76" height="76" rx="20" />
        <rect class="page" x="26" y="26" width="36" height="36" rx="6" />
      </svg>

      <h1>FramelessViewer</h1>
      <p class="tagline">只有页面</p>

      <div class="rule"></div>

      <p class="hint">
        <kbd>Ctrl</kbd><span class="sep">+</span><kbd>L</kbd>
        输入网址开始浏览
      </p>
    </main>
  </body>
</html>
